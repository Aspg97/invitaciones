<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="../CSS/estilos.css" />
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <title>Document</title>
  </head>
  <body>
    <div id="contenedor-ar">
      <a-scene embedded arjs vr-mode-ui="enabled: false" resize="false">
        <a-marker preset="hiro">
          <a-entity position="0 0 0" scale="0.1 0.1 0.1">
            <a-entity
              position=""
              scale="1 1 1"
              gltf-model="https://raw.githubusercontent.com/pedrovelasquez9/ARJS-example/main/tie.glb"
            ></a-entity>
          </a-entity>
        </a-marker>
        <a-entity camera></a-entity>
      </a-scene>
    </div>
    <p>invitación prueba 1</p>
    <div class="contenedor-imagen">
      <img class="Img-invitacion" src="../IMG/pruebaInvitacion.png" alt="" />
    </div>
    <script>
    // Evita que A-Frame ajuste el tamaño automáticamente
    window.addEventListener('resize', function (e) {
      e.stopImmediatePropagation();
    }, true);

    // Fuerza el tamaño correcto del canvas después de cada cambio
    const fixARSize = () => {
      const scene = document.querySelector('a-scene');
      const canvas = scene?.canvas;
      if (canvas) {
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.objectFit = "cover";
      }
    };

    window.addEventListener('resize', fixARSize);
    window.addEventListener('load', fixARSize);
  </script>
  </body>
</html>
