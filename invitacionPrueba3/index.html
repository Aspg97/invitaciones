<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="../CSS/estilos.css" />
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/ar.js/1.7.2/aframe/build/aframe-ar.min.js"></script>
    <title>Document</title>
  </head>
  <body>
    <div id="contenedor-ar">
      <a-scene embedded arjs vr-mode-ui="enabled: false" resize="false">
        <a-marker preset="hiro">
          <a-entity position="0 0 0" scale="0.1 0.1 0.1">
            <a-entity
              position=""
              scale="1"
              gltf-model="https://raw.githubusercontent.com/pedrovelasquez9/ARJS-example/main/tie.glb"
            ></a-entity>
          </a-entity>
          <!--
          <a-entity position="0 0 0" rotation="0 0 0" scale="0.60 0.60 0.60" gltf-model="#fornite" animation-mixer="clip: Emote AfroHouse"></a-entity>
        -->
          <!--
          <a-entity position="0 0 0" rotation="0 0 0" scale="0.60 0.60 0.60" gltf-model="#fornite" animation-mixer="clip: Emote AfroHouse"></a-entity>
        -->
        </a-marker>
        <a-entity camera></a-entity>
      </a-scene>
    </div>
    <p>invitación prueba 1</p>
    <div class="contenedor-imagen">
      <img class="Img-invitacion" src="../IMG/pruebaInvitacion.png" alt="" />
    </div>
  </body>
</html>
