<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" type="text/css" href="../CSS/estilos.css" />
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <title>Document</title>
  </head>
  <body>
    <div id="contenedor-ar">
      <a-scene embedded arjs="debugUIEnabled:false;"
      vr-mode-ui="enabled:false"
      renderer="alpha:true; antialias:true;">
        <a-marker preset="hiro">
          <a-entity position="0 0 0" scale="0.1 0.1 0.1">
            <a-entity
              position=""
              scale="1 1 1"
              gltf-model="https://raw.githubusercontent.com/pedrovelasquez9/ARJS-example/main/tie.glb"
            ></a-entity>
          </a-entity>
        </a-marker>
        <a-entity camera></a-entity>
      </a-scene>
    </div>
    <p>invitación prueba 1</p>
    <div class="contenedor-imagen">
      <img class="Img-invitacion" src="../IMG/pruebaInvitacion.png" alt="" />
    </div>

    <script>
    // 1) Altura de viewport real (soluciona 100vh en móviles)
    function setRealVH() {
      document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
    }
    setRealVH();
    window.addEventListener('resize', setRealVH);
    window.addEventListener('orientationchange', setRealVH);

    // 2) Función que “corrige” el tamaño del canvas si A-Frame intenta cambiarlo
    function lockARCanvasSize() {
      const scene = document.querySelector('a-scene');
      if (!scene) return;
      const canvas = scene.canvas;
      if (!canvas) return;

      // Fuerza tamaño al contenedor
      canvas.style.position   = 'absolute';
      canvas.style.inset      = '0';
      canvas.style.width      = '100%';
      canvas.style.height     = '100%';
      canvas.style.maxWidth   = '100%';
      canvas.style.maxHeight  = '100%';
      canvas.style.objectFit  = 'cover';

      // Observa y revierte cualquier cambio de estilo que A-Frame haga
      if (!canvas.__mo) {
        const mo = new MutationObserver(() => {
          canvas.style.position   = 'absolute';
          canvas.style.inset      = '0';
          canvas.style.width      = '100%';
          canvas.style.height     = '100%';
          canvas.style.maxWidth   = '100%';
          canvas.style.maxHeight  = '100%';
          canvas.style.objectFit  = 'cover';
        });
        mo.observe(canvas, { attributes: true, attributeFilter: ['style'] });
        canvas.__mo = mo;
      }
    }

    // 3) Bloquea el “resize” de A-Frame/AR.js en la medida de lo posible
    //    (no rompe todo, pero evita que cambie el canvas de tamaño)
    const stopResize = (e) => {
      try { e.stopImmediatePropagation(); } catch(_) {}
    };
    window.addEventListener('resize', stopResize, true);
    window.addEventListener('orientationchange', () => {
      // Tras orientación, re-aplica el tamaño correcto
      setTimeout(() => {
        setRealVH();
        lockARCanvasSize();
      }, 50);
    });

    // 4) Aplica el “candado” cuando la escena está lista
    window.addEventListener('load', () => {
      const scene = document.querySelector('a-scene');
      if (!scene) return;

      // Cuando A-Frame termina de crear el canvas
      scene.addEventListener('loaded', () => {
        lockARCanvasSize();
      });

      // Cuando AR.js está listo
      scene.addEventListener('arReady', () => {
        lockARCanvasSize();
      });
    });
    </script>
  </body>
</html>
